<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts Clipper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        input[type="text"], input[type="url"], select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="url"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #1a1a1a;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e0e0e0;
        }

        .status {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: none;
            font-size: 14px;
        }

        .status.show {
            display: block;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
            border: 1px solid #90caf9;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
            border: 1px solid #81c784;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef5350;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .clips-list {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px solid #e0e0e0;
        }

        .clips-list h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #1a1a1a;
        }

        .clip-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
        }

        .clip-title {
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .clip-info {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .clip-reason {
            font-size: 13px;
            color: #555;
            line-height: 1.4;
        }

        .clip-link {
            display: inline-block;
            margin-top: 8px;
            color: #667eea;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }

        .clip-link:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        .info-box {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .info-box strong {
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎬✂️</div>
            <h1>YouTube Shorts Clipper</h1>
            <p class="subtitle">Turn long videos into viral Shorts automatically</p>
        </div>

        <div class="info-box">
            <strong>How it works:</strong> Paste a YouTube URL, and AI will find the best moments and cut them into Shorts-ready clips (15-60 seconds each).
        </div>

        <div class="form-group">
            <label for="youtubeUrl">YouTube Video URL</label>
            <input
                type="url"
                id="youtubeUrl"
                placeholder="https://youtube.com/watch?v=..."
                required
            >
        </div>

        <div class="form-group">
            <label for="channelName">Your Channel Name (optional)</label>
            <input
                type="text"
                id="channelName"
                placeholder="e.g., Money Tips"
                value="Money Tips"
            >
        </div>

        <div class="form-group">
            <label for="action">What to do?</label>
            <select id="action">
                <option value="clip">Just create clips (don't upload)</option>
                <option value="upload">Create clips AND upload to YouTube</option>
            </select>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="submitBtn" onclick="processVideo()">
                Generate Clips
            </button>
            <button class="btn-secondary" onclick="resetForm()">Clear</button>
        </div>

        <div class="status" id="status"></div>

        <div class="clips-list hidden" id="clipsList">
            <h3>Generated Clips</h3>
            <div id="clipsContainer"></div>
        </div>
    </div>

    <script>
        async function processVideo() {
            const youtubeUrl = document.getElementById('youtubeUrl').value.trim();
            const channelName = document.getElementById('channelName').value.trim();
            const action = document.getElementById('action').value;
            const statusEl = document.getElementById('status');
            const submitBtn = document.getElementById('submitBtn');

            if (!youtubeUrl) {
                showStatus('Please enter a YouTube URL', 'error');
                return;
            }

            submitBtn.disabled = true;
            showStatus(`<span class="spinner"></span>Processing your video... This may take a few minutes.`, 'loading');

            try {
                let endpoint, body;

                if (action === 'upload') {
                    endpoint = '/api/clip-and-upload';
                    body = { youtubeUrl, channelName };
                } else {
                    endpoint = '/api/clip-video';
                    body = { youtubeUrl };
                }

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to process video');
                }

                // Display clips
                displayClips(data, action);

                showStatus(`✅ ${data.message}`, 'success');

                if (action === 'upload' && data.clipsUploaded > 0) {
                    showStatus(`✅ ${data.clipsUploaded} clips uploaded to YouTube!`, 'success');
                }

            } catch (err) {
                console.error('Error:', err);
                showStatus(`❌ Error: ${err.message}`, 'error');
            } finally {
                submitBtn.disabled = false;
            }
        }

        function displayClips(data, action) {
            const clipsList = document.getElementById('clipsList');
            const clipsContainer = document.getElementById('clipsContainer');

            let html = '';

            if (action === 'upload' && data.uploads) {
                data.uploads.forEach((upload, i) => {
                    if (upload.status === 'uploaded') {
                        html += `
                            <div class="clip-item">
                                <div class="clip-title">${i + 1}. ${upload.title}</div>
                                <div class="clip-info">✅ Uploaded to YouTube</div>
                                <a href="${upload.url}" target="_blank" class="clip-link">Watch on YouTube →</a>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="clip-item">
                                <div class="clip-title">${i + 1}. ${upload.title}</div>
                                <div class="clip-info">❌ Upload failed: ${upload.error}</div>
                            </div>
                        `;
                    }
                });
            } else if (data.clips) {
                data.clips.forEach((clip, i) => {
                    html += `
                        <div class="clip-item">
                            <div class="clip-title">${i + 1}. ${clip.title}</div>
                            <div class="clip-info">${clip.duration}s • ${clip.path.split('/').pop()}</div>
                            <div class="clip-reason">💡 ${clip.reason}</div>
                        </div>
                    `;
                });
            }

            clipsContainer.innerHTML = html;
            clipsList.classList.remove('hidden');
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = message;
            statusEl.className = `status show ${type}`;
        }

        function resetForm() {
            document.getElementById('youtubeUrl').value = '';
            document.getElementById('channelName').value = 'Money Tips';
            document.getElementById('action').value = 'clip';
            document.getElementById('status').classList.remove('show');
            document.getElementById('clipsList').classList.add('hidden');
        }

        // Allow Enter key to submit
        document.getElementById('youtubeUrl').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                processVideo();
            }
        });
    </script>
</body>
</html>
